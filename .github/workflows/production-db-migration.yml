name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MIGRATE to run the production migration"
        required: true
        type: string

jobs:
  migrate:
    if: ${{ github.event.inputs.confirm == 'MIGRATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production migration
        env:
          AIVEN_PRODUCTION_DATABASE_URL: ${{ secrets.AIVEN_PRODUCTION_DATABASE_URL }}
        run: pnpm run migrate:production
