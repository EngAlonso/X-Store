openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: X-Store point-of-sale and inventory API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: xstore
    description: Authenticated X-Store operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /xstore/auth/status:
    get:
      operationId: getXStoreAuthStatus
      tags: [xstore]
      summary: Get public sign-in status and support contacts
      responses:
        "200":
          description: Public authentication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /xstore/auth/founder:
    post:
      operationId: createInitialPlatformOwner
      tags: [xstore]
      summary: Create the first platform owner during initial setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderAccountInput"
      responses:
        "200":
          description: Newly created platform owner session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A platform owner account has already been created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many founder setup attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /xstore/auth/login:
    post:
      operationId: loginXStoreWithPhone
      tags: [xstore]
      summary: Sign in with a phone number and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneLoginInput"
      responses:
        "200":
          description: Signed-in X-Store account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many sign-in attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /xstore/auth/logout:
    post:
      operationId: logoutXStore
      tags: [xstore]
      summary: Sign out of the current X-Store account
      responses:
        "204":
          description: Signed out
  /xstore/session:
    get:
      operationId: getXStoreSession
      tags: [xstore]
      summary: Get the signed-in user's X-Store role
      responses:
        "200":
          description: Current X-Store user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /xstore/store-settings:
    patch:
      operationId: updateXStoreStoreSettings
      tags: [xstore]
      summary: Update the current store's VAT rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSettingsInput"
      responses:
        "200":
          description: Updated store settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /xstore/dashboard:
    get:
      operationId: getXStoreDashboard
      tags: [xstore]
      summary: Get the role-scoped dashboard summary
      responses:
        "200":
          description: Dashboard metrics and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/tenants:
    get:
      operationId: listXStoreTenants
      tags: [xstore]
      summary: List tenants for platform administrators
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, trial, suspended]
        - name: businessType
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createXStoreTenant
      tags: [xstore]
      summary: Create a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/tenants/{tenantId}:
    patch:
      operationId: updateXStoreTenant
      tags: [xstore]
      summary: Update a tenant's status or subscription
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /xstore/tenants/{tenantId}/credentials:
    patch:
      operationId: updateXStoreTenantCredentials
      tags: [xstore]
      summary: Set a tenant administrator's phone number and password
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCredentialsInput"
      responses:
        "204":
          description: Tenant login credentials updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /xstore/settings/contact:
    get:
      operationId: getXStoreContactSettings
      tags: [xstore]
      summary: Get platform contact settings
      responses:
        "200":
          description: Platform contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateXStoreContactSettings
      tags: [xstore]
      summary: Update platform contact settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSettingsInput"
      responses:
        "200":
          description: Updated contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/team:
    get:
      operationId: listXStoreTeam
      tags: [xstore]
      summary: List team members in the current tenant
      responses:
        "200":
          description: Tenant team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addXStoreTeamMember
      tags: [xstore]
      summary: Add or update a team member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Added or updated team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/team/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateXStoreTeamMember
      tags: [xstore]
      summary: Update a team member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Updated team member account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Phone number is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteXStoreTeamMember
      tags: [xstore]
      summary: Remove a team member account and revoke access
      responses:
        "204":
          description: Access revoked and team member removed; transaction history is retained
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /xstore/subscription-payments:
    get:
      operationId: listXStoreSubscriptionPayments
      tags: [xstore]
      summary: List platform subscription payments
      responses:
        "200":
          description: Subscription payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPayment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createXStoreSubscriptionPayment
      tags: [xstore]
      summary: Record a subscription payment and renewal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPaymentInput"
      responses:
        "201":
          description: Recorded payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /xstore/products:
    get:
      operationId: listXStoreProducts
      tags: [xstore]
      summary: List products visible to the signed-in user
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createXStoreProduct
      tags: [xstore]
      summary: Create a product in the current tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/products/{productId}:
    patch:
      operationId: updateXStoreProduct
      tags: [xstore]
      summary: Update a product in the current tenant
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /xstore/sales:
    get:
      operationId: listXStoreSales
      tags: [xstore]
      summary: List sales visible to the signed-in user
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: checkoutXStoreSale
      tags: [xstore]
      summary: Complete a sale and decrement stock atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Completed sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/sales/{invoiceNo}/items:
    get:
      operationId: getXStoreSaleInvoiceItems
      tags: [xstore]
      summary: Get the products and remaining returnable quantities for an invoice
      parameters:
        - name: invoiceNo
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Items on the invoice
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaleInvoiceItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Insufficient stock or product is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /xstore/reports/profit-loss:
    get:
      operationId: getXStoreProfitLossReport
      tags: [xstore]
      summary: Get role-scoped gross profit and loss totals
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Profit and loss summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitLossReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/held-sales:
    get:
      operationId: listXStoreHeldSales
      tags: [xstore]
      summary: List held carts in the current tenant
      responses:
        "200":
          description: Held sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeldSale"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: holdXStoreSale
      tags: [xstore]
      summary: Save a cart for later checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldSaleInput"
      responses:
        "201":
          description: Held cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldSale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/held-sales/{heldSaleId}:
    delete:
      operationId: releaseXStoreHeldSale
      tags: [xstore]
      summary: Remove a held cart from the current tenant
      parameters:
        - name: heldSaleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Held cart removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /xstore/returns:
    post:
      operationId: createXStoreReturn
      tags: [xstore]
      summary: Return items from an original invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnInput"
      responses:
        "201":
          description: Recorded return
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Requested return exceeds the remaining quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /xstore/returns/batch:
    post:
      operationId: createXStoreReturnBatch
      tags: [xstore]
      summary: Return multiple items from an original invoice atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnBatchInput"
      responses:
        "201":
          description: Recorded returns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnBatchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Requested return exceeds the remaining quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /xstore/exchanges:
    post:
      operationId: createXStoreExchange
      tags: [xstore]
      summary: Process a return and replacement sale as one exchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeInput"
      responses:
        "201":
          description: Completed exchange
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Insufficient stock or return quantity is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /xstore/audit-logs:
    get:
      operationId: listXStoreAuditLogs
      tags: [xstore]
      summary: List sensitive platform support actions
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/platform-database/tables:
    get:
      operationId: listXStorePlatformDatabaseTables
      tags: [xstore]
      summary: List application database tables for the platform owner
      responses:
        "200":
          description: Available database tables and row counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseTablesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/platform-database/rows:
    get:
      operationId: listXStorePlatformDatabaseRows
      tags: [xstore]
      summary: Browse and search rows in one application database table
      parameters:
        - name: tableName
          in: query
          required: true
          schema: { type: string, maxLength: 80 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Paginated table rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseRowsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /xstore/platform-database/tables/{tableName}/rows/{rowId}:
    delete:
      operationId: deleteXStorePlatformDatabaseRow
      tags: [xstore]
      summary: Delete one confirmed row from an allowlisted application table
      parameters:
        - name: tableName
          in: path
          required: true
          schema: { type: string, maxLength: 80 }
        - name: rowId
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformDatabaseDeleteInput"
      responses:
        "200":
          description: Row deleted and the action recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseDeleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The row cannot be deleted safely because it is linked to other data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /xstore/platform-backup/summary:
    get:
      operationId: getXStorePlatformBackupSummary
      tags: [xstore]
      summary: Get the tables and record counts included in a platform backup
      responses:
        "200":
          description: Current backup scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XStorePlatformBackupSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/platform-backup:
    get:
      operationId: downloadXStorePlatformBackup
      tags: [xstore]
      summary: Download a complete backup of platform database tables
      responses:
        "200":
          description: Portable JSON backup file
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Download filename
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XStorePlatformBackup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /xstore/platform-backup/restore:
    post:
      operationId: restoreXStorePlatformBackup
      tags: [xstore]
      summary: Replace all platform database records from a backup after confirmation
      requestBody:
        required: true
        content:
          application/vnd.xstore.platform-backup+json:
            schema:
              $ref: "#/components/schemas/XStorePlatformBackupRestoreInput"
      responses:
        "200":
          description: Platform data restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XStorePlatformBackupRestoreResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Backup does not match the current database schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Backup file exceeds the accepted upload size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
